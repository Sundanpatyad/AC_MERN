  <!-- Recover already-installed PWAs stuck on a stale service worker cache. -->
  <script>
    (function () {
      var KEY = 'ac-pwa-migrate-v3';
      try {
        if (sessionStorage.getItem(KEY) === '1') return;
      } catch (e) {}

      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var stale = regs.filter(function (reg) {
          var url =
            (reg.active && reg.active.scriptURL) ||
            (reg.waiting && reg.waiting.scriptURL) ||
            (reg.installing && reg.installing.scriptURL) ||
            '';
          return url.indexOf('firebase-messaging-sw.js') === -1;
        });
        if (!stale.length) return;

        return Promise.all(stale.map(function (reg) { return reg.unregister(); }))
          .then(function () {
            if (!('caches' in window)) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
          })
          .then(function () {
            try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
            location.reload();
          });
      }).catch(function () {});
    })();
  </script>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          if (!theme) localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          if (!theme) localStorage.setItem('theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
